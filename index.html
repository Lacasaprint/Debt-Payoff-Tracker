ACT['debt-new']   = () => debtModal(null);
ACT['debt-edit']  = el2 => debtModal(el2.dataset.id);
ACT['debt-color'] = el2 => {
  debtColor = el2.dataset.c;
  $$('#modalBody .theme-dot').forEach(x=>x.classList.toggle('active', x.dataset.c===debtColor));
};
ACT['debt-save'] = el2 => {
  const name = $('m_name').value.trim();
  const start = num($('m_start').value);
  const bal = num($('m_bal').value);
  if(!name){ toast('Give the debt a name'); return; }
  if(start <= 0){ toast('Enter the original balance'); return; }
  if(bal < 0){ toast('Balance cannot be negative'); return; }
  const rec = {
    name, kind:$('m_kind').value, creditor:$('m_cred').value.trim(),
    start, balance:bal, rate:clamp(num($('m_rate').value),0,99),
    minPay:Math.max(0, num($('m_min').value)),
    dueDay:clamp(Math.round(num($('m_due').value)),0,31),
    color:debtColor
  };
  const id = el2.dataset.id;
  if(id){
    const d = debtById(id); if(!d) return;
    Object.assign(d, rec);
    if(d.balance > 0.004) d.paidOff = null;
    if(d.balance <= 0.004 && !d.paidOff) d.paidOff = todayIso();
  } else {
    db.debts.push(Object.assign({id:uid(), paidOff: bal <= 0.004 ? todayIso() : null}, rec));
  }
  save(); closeModal(); renderView(); toast(id ? 'Debt updated' : 'Debt added — facing it is the first win');
};
ACT['debt-filter'] = el2 => { debtFilter = el2.dataset.t; RENDER.debts(); };
CHG['debt-sort'] = el2 => { debtSort = el2.value; RENDER.debts(); };
ACT['debt-paid'] = el2 => {
  const d = debtById(el2.dataset.id); if(!d) return;
  confirmModal('Mark as paid off?',
    `<b>${esc(d.name)}</b> will show a paid-off badge and move out of the active plan. Its remaining balance will be set to zero.`,
    'Yes — it\u2019s done', 'debt-paid-yes', `data-id="${d.id}"`);
};
ACT['debt-paid-yes'] = el2 => {
  const d = debtById(el2.dataset.id); if(!d) return;
  d.balance = 0; d.paidOff = todayIso();
  save(); closeModal(); renderView(); toast('Paid off — that one is history! ✿');
};
ACT['debt-reopen'] = el2 => {
  const d = debtById(el2.dataset.id); if(!d) return;
  d.paidOff = null;
  if(d.balance <= 0.004) d.balance = d.start > 0 ? d.start : 0;
  save(); renderView(); toast('Debt reopened — update the balance as needed');
};
ACT['debt-del'] = el2 => {
  const d = debtById(el2.dataset.id); if(!d) return;
  const pays = db.payments.filter(p=>p.debtId===d.id).length;
  confirmModal('Delete debt?', `<b>${esc(d.name)}</b>${pays ? ` and its <b>${pays}</b> logged payment${pays===1?'':'s'}` : ''} will be removed. This cannot be undone.`,
    'Delete', 'debt-del-yes', `data-id="${d.id}"`);
};
ACT['debt-del-yes'] = el2 => {
  db.debts = db.debts.filter(d=>d.id!==el2.dataset.id);
  db.payments = db.payments.filter(p=>p.debtId!==el2.dataset.id);
  save(); closeModal(); renderView(); toast('Debt removed');
};

/* ============================================================
   VIEW 3 · PAYOFF PLAN — snowball, avalanche & the freedom date
   ============================================================ */
RENDER.plan = function(){
  const t = totals();
  const method = db.settings.method || 'snowball';
  const budget = Math.max(0, num(db.settings.monthlyBudget));
  const sim = payoffSim(method, budget);
  const altMethod = method === 'snowball' ? 'avalanche' : 'snowball';
  const alt = payoffSim(altMethod, budget);
  const base = minimumOnlySim();
  const interestSaved = base.feasible ? Math.max(0, base.interest - sim.interest) : 0;
  const monthsSaved = base.feasible && base.months > sim.months ? base.months - sim.months : 0;
  const order = orderedDebts(method);
  const mpInc = sum(db.budget.incomes.map(x=>x.amount));
  const mpExp = sum(db.budget.expenses.map(x=>x.amount));
  const leftPool = Math.max(mpInc - mpExp, t.minTotal);

  const head = viewHead('Draw the route',
    'Payoff <em>Plan</em>',
    `<b>${order.length}</b> open debt${order.length===1?'':'s'} · budget <b>${fmtM(budget)}/mo</b> · method <b>${method}</b>`,
    '');

  const strat = `<div class="panel" style="margin-bottom:18px">
    <div class="panel-head"><div class="card-title">Strategy</div>
      <div class="card-sub">change anytime — everything recomputes</div></div>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">
      <div class="seg">
        <button data-act="plan-method" data-t="snowball" class="${method==='snowball'?'on':''}">Snowball</button>
        <button data-act="plan-method" data-t="avalanche" class="${method==='avalanche'?'on':''}">Avalanche</button>
        <button data-act="plan-method" data-t="custom" class="${method==='custom'?'on':''}">Custom</button>
      </div>
      <div class="bud-input">
        <span class="sm mut" style="font-weight:700">MONTHLY DEBT BUDGET</span>
        <input class="in" type="number" min="0" step="10" value="${budget}" data-inp="plan-budget">
        <button class="btn btn-sm" data-act="plan-use-leftover">${icon('calc')} Use Money Plan leftover${leftPool >= 0 ? ' ('+fmtM(leftPool)+')' : ''}</button>
      </div>
    </div>
    <div class="sm mut" style="margin-top:9px;line-height:1.6">${method==='snowball'
      ? '<b>Snowball</b> pays the smallest balance first — quick wins keep you motivated.'
      : method==='avalanche'
      ? '<b>Avalanche</b> pays the highest APR first — mathematically the cheapest route.'
      : '<b>Custom</b> lets you line the debts up in your own order — use the arrows below.'}
      ${!sim.feasible ? ` <b style="color:var(--oxb)">Heads up: the budget is below the total minimums (${fmtM(t.minTotal)}) — raise it to reach the finish line.</b>` : ''}</div>
  </div>`;

  const strip = `<div class="sim-strip">
    <div class="sim-cell"><span>Debt-free date</span><b class="${sim.feasible?'ok':''}">${sim.feasible ? mkLabelFull(sim.freeDate.slice(0,7)) : '—'}</b><small>${sim.feasible ? sim.months+' months from now' : 'budget too low'}</small></div>
    <div class="sim-cell"><span>Total interest</span><b>${sim.feasible ? fmtM(sim.interest) : '—'}</b><small>until the last payment</small></div>
    <div class="sim-cell"><span>Interest saved</span><b class="ok">${fmtM(interestSaved)}</b><small>vs minimum-only payments</small></div>
    <div class="sim-cell"><span>Time saved</span><b class="ok">${monthsSaved ? monthsSaved+' mo' : '—'}</b><small>vs minimum-only payments</small></div>
  </div>`;

  const orderCard = `<div class="panel">
    <div class="panel-head"><div class="card-title">Payoff order</div>
      <div class="card-sub">${method==='custom' ? 'arrows reorder the queue' : order.length ? 'focus on #1' : 'no open debts'}</div></div>
    <div>${order.length ? order.map((d,i)=>`
      <div class="order-row ${i===0?'is-focus':''}">
        <span class="order-n">${i+1}</span>
        <div class="order-main">
          <div class="order-t">${esc(d.name)}</div>
          <div class="order-s">${fmtM(Math.max(0,d.balance))} left · ${(d.rate||0).toFixed(1)}% APR · min ${fmtM(d.minPay)}</div>
        </div>
        ${i===0 ? '<span class="order-tag">focus first</span>' : ''}
        ${method==='custom' ? `<span style="display:flex;gap:4px;flex:0 0 auto">
          <button class="icon-btn" data-act="plan-move" data-id="${d.id}" data-dir="-1" aria-label="Move up" ${i===0?'disabled':''}>${icon('chevU')}</button>
          <button class="icon-btn" data-act="plan-move" data-id="${d.id}" data-dir="1" aria-label="Move down" ${i===order.length-1?'disabled':''}>${icon('chevD')}</button>
        </span>` : ''}
      </div>`).join('') : '<div class="empty">No open debts — add them on the My Debts page and the order appears here.</div>'}</div>
  </div>`;

  const chartCard = `<div class="panel">
    <div class="panel-head"><div class="card-title">Balance curve</div>
      <div class="card-sub">your plan vs the alternative</div></div>
    <div id="plChart"></div>
    <div class="sm mut" style="margin-top:8px;line-height:1.6">The curve assumes interest accrues monthly and every leftover dollar rolls down the queue. Log real payments to keep it honest.</div>
  </div>`;

  const projCard = `<div class="panel" style="margin-top:18px">
    <div class="panel-head"><div class="card-title">Per-debt projection</div>
      <div class="card-sub">under the current plan</div></div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>#</th><th>Debt</th><th class="num">Balance</th><th class="num">APR</th><th>Projected payoff</th><th class="num">Interest until payoff</th></tr></thead>
      <tbody>${order.length ? order.map((d,i)=>{
        const pd = sim.perDebt[d.id] || {interest:0, months:0};
        const date = sim.feasible && pd.months ? mkLabelFull(iso(addM(TODAY, pd.months)).slice(0,7)) : '—';
        return `<tr>
          <td><span class="order-n" style="width:20px;height:20px;font-size:10px">${i+1}</span></td>
          <td><b>${esc(d.name)}</b></td>
          <td class="num">${fmtM(Math.max(0,d.balance))}</td>
          <td class="num">${(d.rate||0).toFixed(1)}%</td>
          <td>${date}</td>
          <td class="num">${fmtM(pd.interest, true)}</td>
        </tr>`;
      }).join('') : '<tr><td colspan="6"><div class="empty">Nothing to project yet.</div></td></tr>'}</tbody>
    </table></div>
  </div>`;

  el().innerHTML = head + strat + `<div class="split2">${chartCard}${orderCard}</div>` + strip + projCard;
  drawPlanChart(method, altMethod, sim, alt, base);
};
function drawPlanChart(method, altMethod, sim, alt, base){
  const n = Math.max(sim.series.length, alt.series.length, base.series.length);
  const labels = Array.from({length:n},(_,i)=> i===0 ? 'now' : 'm+'+i);
  const pad = (arr) => arr.concat(Array(Math.max(0, n - arr.length)).fill(NaN));
  chartLines('plChart', labels, [
    {name:'your plan · '+method,       color:'#C4643B', data:pad(sim.series),  area:true},
    {name:altMethod+' (same budget)',  color:'#45789E', data:pad(alt.series),  dash:true},
    {name:'minimums only',             color:'#C0575B', data:pad(base.series), dash:true}
  ], {w:640, h:250, fs:9});
}

/* ============================================================
   VIEW 7 · MILESTONES — the celebration engine
   ============================================================ */
function milestonePaidDate(target){
  /* first date the total paid (logged payments + any paydown recorded
     before logging started) crossed target — always agrees with balances */
  const t = totals();
  if(t.startTotal <= 0 || t.paidTotal < target) return null;
  const allPaid = payTotals().allPaid;
  const init = Math.max(0, t.paidTotal - allPaid);
  const sorted = db.payments.slice().sort((a,b)=> a.date<b.date?-1:1);
  if(init >= target) return sorted.length ? sorted[0].date : todayIso();
  let cum = 0;
  for(const p of sorted){
    cum += p.amount;
    if(cum >= target - init) return p.date;
  }
  return sorted.length ? sorted[sorted.length-1].date : todayIso();
}
function computedMilestones(){
  const t = totals();
  const p = payTotals();
  const out = [];
  if(db.debts.length){
    /* first payment */
    const sorted = db.payments.slice().sort((a,b)=> a.date<b.date?-1:1);
    out.push({key:'first', title:'First payment logged', sub:'The hardest check to write — and the one that started everything.',
      icon:'flag', done: sorted.length > 0, date: sorted.length ? sorted[0].date : null});
    /* amount milestones */
    const thresholds = [500, 1000, 2500, 5000, 10000, 20000, 40000, 75000].filter(x => x < Math.max(t.startTotal*1.3, 2000));
    for(const th of thresholds){
      const dt = milestonePaidDate(th);
      out.push({key:'amt'+th, title:fmtM(th)+' paid off', sub:'Total debt reduced by '+fmtM(th)+' since day one.',
        icon:'trend', done: !!dt, date: dt, pct: clamp(t.paidTotal/th*100, 0, 100)});
    }
    /* percent milestones */
    for(const pc of [10,25,50,75,90]){
      const dt = milestonePaidDate(t.startTotal*pc/100);
      out.push({key:'pct'+pc, title:pc+'% debt free', sub:fmtM(t.startTotal*pc/100)+' of the original weight lifted.',
        icon:'target', done: !!dt, date: dt, pct: clamp(t.pctFree/pc*100, 0, 100)});
    }
    /* per-debt paid off */
    for(const d of db.debts){
      if(d.paidOff || d.balance <= 0.004){
        out.push({key:'debt'+d.id, title:esc(d.name)+' — paid in full', sub:kindLabel(d.kind)+(d.creditor?' · '+d.creditor:''),
          icon:'star', done:true, date:d.paidOff});
      }
    }
    /* debt free */
    out.push({key:'free', title:'DEBT FREE', sub:'Every balance at zero. This is the summit.',
      icon:'trophy', done: t.balTotal <= 0.004, date: t.balTotal <= 0.004 ? todayIso() : null,
      pct: t.pctFree});
  }
  /* custom milestones merge in */
  for(const m of db.milestones){
    out.push({key:'c'+m.id, title:m.title, sub:m.note||'', icon:'spark', done:!!m.done, date:m.done ? (m.date||null) : null, custom:m.id});
  }
  return out;
}

/* ============================================================
   VIEW 9 · PROGRESS — the long view of the journey
   ============================================================ */
RENDER.progress = function(){
  const t = totals(), p = payTotals();
  const sorted = db.payments.slice().sort((a,b)=> a.date<b.date?-1:1);
  const firstDate = sorted.length ? sorted[0].date : null;
  const monthsIn = firstDate ? Math.max(1, Math.round((TODAY - fromIso(firstDate))/86400000/30.44)) : 0;
  const biggest = sorted.reduce((m,x)=> Math.max(m, x.amount), 0);
  const trend = balanceTrend(12);
  const pm = paymentsByMonth(12);
  const sim = payoffSim(db.settings.method || 'snowball', db.settings.monthlyBudget);

  /* cumulative paid series */
  let cum = 0;
  const cumByMk = {};
  for(const p2 of sorted){ cum += p2.amount; cumByMk[p2.date.slice(0,7)] = cum; }
  const mks = lastMks(12);
  let carry = cumByMk[mks[0]] != null ? 0 : 0;
  const beforeStart = sum(db.payments.filter(x=>x.date.slice(0,7) < mks[0]).map(x=>x.amount));
  let run = beforeStart;
  const cumSeries = mks.map(mk => { run = cumByMk[mk] != null ? cumByMk[mk] : run; return run; });

  const head = viewHead('The long view',
    'Prog<em>ress</em>',
    `every line drawn from your ${p.count} logged payment${p.count===1?'':'s'}`,
    '');

  const kpis = `<div class="kpis">
    ${kpiCard('k-teal','trend','Total paid', fmtM(p.allPaid), 'since day one')}
    ${kpiCard('k-blue','target','% debt free', Math.round(t.pctFree)+'%', fmtM(t.startTotal)+' started')}
    ${kpiCard('k-peach','cal','Months in', monthsIn ? String(monthsIn) : '—', firstDate ? 'since '+fmtDate(firstDate) : 'log a payment')}
    ${kpiCard('k-green','spark','Biggest payment', fmtM(biggest), 'avg '+fmtM(p.count ? p.allPaid/p.count : 0))}
  </div>`;

  const charts = `<div class="grid2">
    <div class="panel">
      <div class="panel-head"><div class="card-title">Total balance trend</div><div class="card-sub">12 months</div></div>
      <div id="pgTrend"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="card-title">Cumulative paid</div><div class="card-sub">money gone from debt</div></div>
      <div id="pgCum"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="card-title">Balance vs interest by month</div><div class="card-sub">where payments went</div></div>
      <div id="pgStack"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="card-title">Composition now</div><div class="card-sub">who holds what</div></div>
      <div id="pgDonut"></div>
    </div>
  </div>`;

  const table = `<div class="panel" style="margin-top:18px">
    <div class="panel-head"><div class="card-title">Debt-by-debt scoreboard</div>
      <div class="card-sub">payoff dates follow your ${db.settings.method||'snowball'} plan</div></div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>Debt</th><th class="num">Original</th><th class="num">Balance</th><th class="num">Paid</th><th class="num">% done</th><th class="num">Interest paid</th><th>Projected payoff</th></tr></thead>
      <tbody>${db.debts.length ? db.debts.map(d=>{
        const paid = d.start - Math.max(0,d.balance);
        const ip = sum(db.payments.filter(x=>x.debtId===d.id).map(x=>x.interest||0));
        const pd = sim.perDebt[d.id];
        const dt = d.paidOff || d.balance <= 0.004 ? (d.paidOff ? fmtDateY(d.paidOff) : 'paid ✓')
          : (sim.feasible && pd && pd.months ? mkLabelFull(iso(addM(TODAY, pd.months)).slice(0,7)) : '—');
        return `<tr>
          <td><span class="catdot" style="background:${d.color}"></span><b>${esc(d.name)}</b></td>
          <td class="num">${fmtM(d.start)}</td>
          <td class="num">${fmtM(Math.max(0,d.balance))}</td>
          <td class="num amt-pos">${fmtM(paid)}</td>

  chartLines('pgCum', mks.map(mkShort), [{name:'Cumulative paid', color:'#3E8E6E', data:cumSeries, area:true}], {w:460, h:220, fs:9});
  chartStackedLocal('pgStack', pm.labels, pm.data, mks.map(mk => sum(db.payments.filter(x=>x.date.slice(0,7)===mk).map(x=>x.interest||0))));

/* ============================================================
   VIEW 10 · INTEREST INSIGHTS — what debt really costs
   ============================================================ */
RENDER.interest = function(){
  const t = totals();
  const budget = Math.max(0, num(db.settings.monthlyBudget));
  const base = payoffSim(db.settings.method || 'snowball', budget);
  const scenarioExtras = [25, 50, 100, 250];
  const scenarios = [{extra:0}].concat(scenarioExtras.map(e=>({extra:e}))).map(s => {
    const sim = payoffSim(db.settings.method || 'snowball', budget + s.extra);
    return {extra:s.extra, months:sim.months, interest:sim.interest, feasible:sim.feasible,
      savedInt: base.feasible ? Math.max(0, base.interest - sim.interest) : 0,
      savedMo:  base.feasible ? Math.max(0, base.months - sim.months) : 0};
  });

  const ranked = activeDebts().slice().sort((a,b)=> (b.rate||0)-(a.rate||0));

  const head = viewHead('Know the true cost',
    'Interest <em>Insights</em>',
    `you are paying <b>${fmtM(t.moInterest, true)}</b> in interest every single month`,
    '');

  const strip = `<div class="sim-strip">
    <div class="sim-cell"><span>Interest / month</span><b style="color:var(--oxb)">${fmtM(t.moInterest, true)}</b><small>accrues while balances last</small></div>
    <div class="sim-cell"><span>Interest / year</span><b style="color:var(--oxb)">${fmtM(t.moInterest*12)}</b><small>at today's balances</small></div>
    <div class="sim-cell"><span>Average APR</span><b>${t.avgApr ? t.avgApr.toFixed(1)+'%' : '—'}</b><small>weighted by balance</small></div>
    <div class="sim-cell"><span>Plan interest</span><b>${base.feasible ? fmtM(base.interest) : '—'}</b><small>total until freedom</small></div>
  </div>`;

  const rankCard = `<div class="panel">
    <div class="panel-head"><div class="card-title">APR ranking</div>
      <div class="card-sub">highest cost first</div></div>
    ${ranked.length ? ranked.map(d=>`
      <div class="mini-bar" style="padding:7px 0">
        <span class="mb-l" style="width:110px">${esc(d.name)}</span>
        <div class="bar"><i style="width:${t.avgApr ? clamp((d.rate||0)/Math.max(...ranked.map(x=>x.rate||0))*100,4,100) : 0}%;background:var(--oxb)"></i></div>
        <span class="mb-v">${(d.rate||0).toFixed(1)}% · ${fmtM(Math.max(0,d.balance)*(d.rate||0)/1200, true)}/mo</span>
      </div>`).join('')
    : '<div class="empty">No open debts — nothing is costing you interest. Lovely.</div>'}
    <div class="sm mut" style="margin-top:8px;line-height:1.6">A card at 25% APR doubles its balance in roughly three years if untouched — this page shows exactly where the fire burns hottest.</div>
  </div>`;

  const simCard = `<div class="panel">
    <div class="panel-head"><div class="card-title">Extra payment impact</div>
      <div class="card-sub">vs your current ${fmtM(budget)}/mo plan</div></div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>Plan</th><th class="num">Debt-free</th><th class="num">Total interest</th><th class="num">Interest saved</th><th class="num">Time saved</th></tr></thead>
      <tbody>${scenarios.map(s=>`
        <tr>
          <td><b>${fmtM(budget + s.extra)}/mo</b>${s.extra ? ` <span class="pill green">+${fmtM(s.extra)}</span>` : ' <span class="pill gray">current</span>'}</td>
          <td class="num">${s.feasible ? mkLabel(base.freeDate ? iso(addM(TODAY, s.months)).slice(0,7) : '').replace('&nbsp;',' ') : '—'}</td>
          <td class="num">${s.feasible ? fmtM(s.interest) : '—'}</td>
          <td class="num amt-pos">${s.savedInt ? fmtM(s.savedInt) : '—'}</td>
          <td class="num">${s.savedMo ? s.savedMo+' mo' : '—'}</td>
        </tr>`).join('')}</tbody>
    </table></div>
    <div style="margin-top:12px" id="inChart"></div>
    <div class="sm mut" style="margin-top:6px;line-height:1.6">Small extras compound: the difference between paying the minimums and paying a little more is usually thousands in avoided interest.</div>

  el().innerHTML = head + strip + `<div class="split2">${simCard}${rankCard}</div>`;

};

  const list = db.scores.slice().sort((a,b)=> a.date<b.date?-1:1);
  const latest = list.length ? list[list.length-1] : null;
  const first = list.length ? list[0] : null;
  const change = latest && first ? latest.score - first.score : 0;
  const ring = latest ? clamp((latest.score - SCORE_MIN)/(SCORE_MAX-SCORE_MIN)*100, 2, 100) : 0;
  const band = scoreBand(latest ? latest.score : 0);

  const head = viewHead('Rebuild the number',
    'Credit <em>Score</em>',
    'lower balances mean a healthier score — track the climb here',
    `<button class="btn btn-primary" data-act="score-new">${icon('plus')} Add check-in</button>`);

  const hero = `<div class="panel" style="margin-bottom:18px"><div class="score-hero">
    <div class="score-ring">
      <svg width="118" height="118" viewBox="0 0 118 118">
        <circle cx="59" cy="59" r="50" fill="none" stroke="var(--track)" stroke-width="11"/>
        <circle cx="59" cy="59" r="50" fill="none" stroke="${band.color}" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${(ring*3.14159).toFixed(1)} 999"/>
      </svg>
      <div class="sr-val"><b>${latest ? latest.score : '—'}</b><small>latest</small></div>
    </div>
    <div style="flex:1;min-width:220px">
      <span class="score-band" style="background:${band.bg};color:${band.color}">${latest ? band.label : 'no data yet'}</span>
      <div class="bignum" style="margin-top:8px">${change ? (change > 0 ? '+' : '') + change : '—'} <em>points since first check-in</em></div>
      <div class="sm mut" style="margin-top:4px;line-height:1.6">${latest
        ? `Last checked ${fmtDateY(latest.date)} · ${esc(latest.bureau || '—')}${latest.note ? ' · '+esc(latest.note) : ''}`
        : 'Log your first check-in and the chart starts drawing itself.'}</div>
      <div class="sm mut" style="margin-top:6px">${list.length} check-in${list.length===1?'':'s'} recorded</div>
    </div>
  </div></div>`;

  const chart = list.length ? `<div class="panel" style="margin-bottom:18px">
    <div class="panel-head"><div class="card-title">Score history</div><div class="card-sub">${list.length} entries</div></div>
    <div id="scChart"></div>
  </div>` : '';

  const table = `<div class="panel pad0"><div style="padding:16px 16px 0" class="panel-head"><div class="card-title">Check-in log</div></div>
    <div style="overflow-x:auto;padding:0 8px 8px"><table class="tbl">
      <thead><tr><th>Date</th><th class="num">Score</th><th>Change</th><th>Bureau</th><th>Note</th><th></th></tr></thead>
      <tbody>${list.length ? list.map((x,i)=>{
        const prev = i > 0 ? list[i-1].score : null;
        const diff = prev != null ? x.score - prev : null;
        return `<tr>
          <td>${fmtDateY(x.date)}</td>
          <td class="num"><b>${x.score}</b></td>
          <td class="num">${diff == null ? '—' : `<span class="${diff >= 0 ? 'amt-pos' : 'amt-neg'}">${diff >= 0 ? '+' : ''}${diff}</span>`}</td>
          <td>${esc(x.bureau||'—')}</td>
          <td class="mut">${esc(x.note||'')}</td>
          <td class="ctr"><button class="icon-btn" data-act="score-del" data-id="${x.id}" aria-label="Delete entry">${icon('trash')}</button></td>
        </tr>`;
      }).join('') : '<tr><td colspan="6"><div class="empty">No check-ins yet.</div></td></tr>'}</tbody>
    </table></div></div>`;

  el().innerHTML = head + hero + chart + table;
  if(list.length){
    chartLines('scChart', list.map(x=>fmtDate(x.date)),
      [{name:'Score', color:'#45789E', data:list.map(x=>x.score), area:true}], {w:640, h:210, fs:9});
  }
};
function scoreBand(s){
  if(!s) return {label:'', color:'var(--faint)', bg:'var(--soft)'};
  if(s >= 800) return {label:'Exceptional', color:'#2E7D5B', bg:'#DFF2E9'};
  if(s >= 740) return {label:'Very good',  color:'#45789E', bg:'#E3F0FA'};
  if(s >= 670) return {label:'Good',       color:'#3E8E6E', bg:'#DFF2EF'};
  if(s >= 580) return {label:'Fair',       color:'#9A6A22', bg:'#FBF1DC'};
  return {label:'Building', color:'#C0575B', bg:'#F9E7E7'};
}
ACT['score-new'] = () => {
  openModal(`<h3>Credit score <em>check-in</em></h3>
  <div class="form-grid">
    <div class="field"><span>DATE</span><input class="in" id="m_date" type="date" value="${todayIso()}"></div>
    <div class="field"><span>SCORE (${SCORE_MIN}–${SCORE_MAX})</span><input class="in" id="m_score" type="number" min="${SCORE_MIN}" max="${SCORE_MAX}" placeholder="e.g. 640"></div>
    <div class="field"><span>BUREAU</span><select class="in" id="m_bureau">${BUREAUS.map(b=>`<option>${b}</option>`).join('')}</select></div>
    <div class="field"><span>NOTE (OPTIONAL)</span><input class="in" id="m_note" placeholder="e.g. card below 30%"></div>
  </div>
  <div class="modal-actions">
    <button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" data-act="score-save">${icon('check')} Save</button>
  </div>`);
};
ACT['score-save'] = () => {
  const score = Math.round(num($('m_score').value));
  if(score < SCORE_MIN || score > SCORE_MAX){ toast('Score must be between '+SCORE_MIN+' and '+SCORE_MAX); return; }
  db.scores.push({id:uid(), date:$('m_date').value||todayIso(), score, bureau:$('m_bureau').value, note:$('m_note').value.trim()});
  save(); closeModal(); renderView(); toast('Check-in saved — keep watching it climb');
};
ACT['score-del'] = el2 => {
  db.scores = db.scores.filter(x=>x.id!==el2.dataset.id);
  save(); renderView(); toast('Entry removed');
};

/* ============================================================
   VIEW 12 · MOTIVATION — the why behind every payment
   ============================================================ */
const AFFIRMATIONS = [
  'Every payment is a vote for the life I want.',
  'Debt is temporary — the habits I build now are forever.',
  'I can do hard things, one month at a time.',
  'Progress beats perfection. Paid is peaceful.'
];
RENDER.motivation = function(){
  const wins = db.wins.slice().sort((a,b)=> a.date<b.date?1:-1);
  const mine = Array.isArray(db.affirmations) ? db.affirmations : [];
  const t = totals();

  const head = viewHead('Feed the fire',
    'Moti<em>vation</em>',
    'the why behind every payment — read it on the hard days',
    `<button class="btn btn-primary" data-act="win-new">${icon('plus')} Add a win</button>`);

  const why = `<div class="panel" style="margin-bottom:18px">
    <div class="panel-head"><div class="card-title">Why I am doing this</div>
      <div class="card-sub">autosaves as you type</div></div>
    <textarea class="in why-box" data-inp="why-edit" placeholder="Picture the day the last payment clears… what does that morning feel like? Write it here.">${esc(db.why||'')}</textarea>
  </div>`;

  const affirm = `<div class="panel">
    <div class="panel-head"><div class="card-title">Affirmations</div>
      <div class="card-sub">say them out loud — seriously</div></div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px">
      ${AFFIRMATIONS.map(a=>`<span class="sticker">${icon('sun')}${esc(a)}</span>`).join('')}
    </div>
    ${mine.length ? `<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px">
      ${mine.map(a=>`<span class="sticker" style="transform:rotate(1.2deg)">${esc(a)}
        <button class="icon-btn" data-act="aff-del" data-id="${a.id}" aria-label="Remove">${icon('x')}</button></span>`).join('')}
    </div>` : ''}
    <div style="display:flex;gap:8px">
      <input class="in" id="affInput" placeholder="write your own…" data-inp="aff-inp">
      <button class="btn btn-soft" data-act="aff-add">${icon('plus')} Add</button>
    </div>
  </div>`;

  const winsPanel = `<div class="panel">
    <div class="panel-head"><div class="card-title">Wins journal</div>
      <div class="card-sub">${wins.length} moment${wins.length===1?'':'s'} worth remembering</div></div>
    ${wins.length ? wins.map(w=>`
      <div class="win-item">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
          <div class="win-t">${esc(w.title)}</div>
          <button class="icon-btn" data-act="win-del" data-id="${w.id}" aria-label="Delete win">${icon('trash')}</button>
        </div>
        <div class="win-d">${fmtDate(w.date)}</div>
        ${w.note ? `<div class="win-n">${esc(w.note)}</div>` : ''}
      </div>`).join('')
    : '<div class="empty">Wins grow quietly — capture them here so future-you can see how far you came.</div>'}
    <div class="sm mut" style="margin-top:10px;line-height:1.6">${t.paidTotal > 0
      ? 'So far you have paid down <b>'+fmtM(t.paidTotal)+'</b>. That number is proof, not luck.'
      : 'Your first win is one payment away.'}</div>
  </div>`;

  el().innerHTML = head + why + `<div class="split2">${winsPanel}${affirm}</div>`;
};
INP['why-edit'] = el2 => { db.why = el2.value; save(); };
let affDraft = '';
INP['aff-inp'] = el2 => { affDraft = el2.value; };
ACT['aff-add'] = () => {
  const v = affDraft.trim();
  if(!v){ toast('Write the affirmation first'); return; }
  if(!Array.isArray(db.affirmations)) db.affirmations = [];
  db.affirmations.push({id:uid(), text:v});
  affDraft = '';
  const inp = $('affInput'); if(inp) inp.value = '';
  save(); renderView(); toast('Added to your wall');
};
ACT['aff-del'] = el2 => {
  db.affirmations = (db.affirmations||[]).filter(a=>a.id!==el2.dataset.id);
  save(); renderView(); toast('Removed');
};
ACT['win-new'] = () => {
  openModal(`<h3>Log a <em>win</em></h3>
  <div class="form-grid">
    <div class="field"><span>DATE</span><input class="in" id="m_date" type="date" value="${todayIso()}"></div>
    <div class="field"><span>TITLE</span><input class="in" id="m_name" placeholder="e.g. Cut the food delivery habit"></div>
    <div class="field full"><span>THE STORY (OPTIONAL)</span><textarea class="in" id="m_note" placeholder="what happened, how it felt"></textarea></div>
  </div>
  <div class="modal-actions">
    <button class="btn" data-act="modal-close">Cancel</button>
    <button class="btn btn-primary" data-act="win-save">${icon('check')} Save win</button>
  </div>`);
};
ACT['win-save'] = () => {
  const title = $('m_name').value.trim();
  if(!title){ toast('Name the win'); return; }
  db.wins.push({id:uid(), date:$('m_date').value||todayIso(), title, note:$('m_note').value.trim()});
  save(); closeModal(); renderView(); toast('Win logged — future-you says thanks');
};
ACT['win-del'] = el2 => {
  db.wins = db.wins.filter(w=>w.id!==el2.dataset.id);
  save(); renderView(); toast('Win removed');
};

/* ============================================================
   VIEW 13 · SETTINGS — personalize · backup · credits
   ============================================================ */
RENDER.settings = function(){
  const s = db.settings;
  const bytes = (()=>{ try{ return (localStorage.getItem(LS_KEY)||'').length; }catch(e){ return 0; } })();
  el().innerHTML = viewHead('Make it yours',
    'Set<em>tings</em>',
    'everything is stored only in this browser — private by design',
    '')
  + `<div class="set-grid">
      <div class="panel">
        <div class="panel-head"><div class="card-title">Personalize</div>
          <div class="card-sub">original &amp; copyright-safe</div></div>
        <div class="field" style="margin-bottom:10px"><span>YOUR NAME (FOR GREETINGS)</span>
          <input class="in" placeholder="e.g. Alex" value="${esc(s.name)}" data-chg="set-name"></div>
        <div class="field" style="margin-bottom:10px"><span>CURRENCY SYMBOL</span>
          <select class="in" data-chg="set-cur">${CUR_OPTIONS.map(o=>{
            const sym = o.split(' — ')[0];
            return `<option value="${sym}" ${s.cur===sym?'selected':''}>${o}</option>`;
          }).join('')}</select></div>
        <div class="field"><span>ACCENT MOOD</span>
          <div style="display:flex;gap:9px;padding-top:6px;flex-wrap:wrap">
            ${MOODS.map(m=>`<button class="theme-dot ${s.mood===m.id?'active':''}" data-theme-set="${m.id}" style="background:${m.c}" title="${m.t}" aria-label="${m.t}"></button>`).join('')}
          </div></div>
        <div class="sm mut" style="margin-top:10px;line-height:1.6">All palettes, wording, icons and the sunrise illustration in this app are original creations made for LaCasaPrint planners — nothing here borrows third-party designs, so your tracker stays safely yours.</div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="card-title">Backup &amp; restore</div>
          <div class="card-sub">JSON file · stays on your device</div></div>
        <p class="sm mut" style="line-height:1.65;margin-bottom:10px">Export everything — debts, payments, plan, budget, funds, scores and wins — into one file you can keep safe or move to another browser. Importing replaces the current data.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-primary" data-act="export-data">${icon('download')} Export data</button>
          <label class="btn" style="cursor:pointer">${icon('upload')} Import data
            <input type="file" accept=".json,application/json" style="display:none" data-chg="import-data"></label>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="card-title">Demo data</div></div>
        <p class="sm mut" style="line-height:1.65;margin-bottom:10px">Curious what a lived-in tracker looks like? Load a realistic sample: five debts, seven months of payments, a money plan, emergency fund, sinking funds, credit-score history and wins. Explore freely and clear it whenever you like.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" data-act="demo-load">${icon('spark')} Load demo data</button>
          <button class="btn" data-act="go" data-to="dashboard">${icon('eye')} Preview dashboard</button>
        </div>
      </div>
      <div class="panel danger-zone">
        <div class="panel-head"><div class="card-title">Clear all data</div></div>
        <p class="sm mut" style="line-height:1.65;margin-bottom:10px">Removes <b>every</b> entry: debts, payments, money plan, funds, scores, wins and milestones. Type <b>CLEAR</b> below to unlock the button — a confirmation step will ask you once more.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input class="in" style="width:130px" placeholder="Type CLEAR" data-inp="clear-check" id="clearInput" autocomplete="off">
          <button class="btn armed" id="clearBtn" data-act="clear-all" disabled>${icon('trash')} Clear all data</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="card-title">How this tracker connects</div></div>
        <div class="statline"><span>My Debts</span><b>feeds plan · dashboard · milestones</b></div>
        <div class="statline"><span>Payments</span><b>lower balances · move every chart</b></div>
        <div class="statline"><span>Money Plan</span><b>sets the Payoff Plan budget</b></div>
        <div class="statline"><span>Payoff Plan</span><b>projects every payoff date</b></div>
        <div class="statline"><span>Emergency Fund</span><b>protects the plan · dashboard</b></div>
        <div class="statline"><span>Milestones</span><b>unlock automatically from data</b></div>
        <div class="sm mut" style="margin-top:10px;line-height:1.6">One system, thirteen views — change a number anywhere and the whole journey recalculates.</div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="card-title">About this planner</div></div>
        <div class="statline"><span>Storage used</span><b>${(bytes/1024).toFixed(1)} KB</b></div>
        <div class="statline"><span>Data location</span><b>this browser only</b></div>
        <div class="statline"><span>Sections</span><b>13</b></div>
        <div class="statline"><span>Version</span><b>1.0</b></div>
        <div class="sm mut" style="margin-top:10px;line-height:1.6">Debt Payoff Tracker is an original HTML web app — it runs entirely offline, needs no account, and never sends your numbers anywhere.</div>
      </div>
      <a class="lacasa-card" href="https://lacasaprint.etsy.com" target="_blank" rel="noopener noreferrer" aria-label="Created by LaCasaPrint — visit the LaCasaPrint Etsy shop">
        <div class="lc-by">Created by</div>
        <div class="lc-name">La<em>Casa</em>Print</div>
        <div class="lc-sub">Planners &amp; printables — crafted with care</div>
        <div class="lc-hand">visit the shop ↗ lacasaprint.etsy.com</div>
      </a>
    </div>`;
};
CHG['set-name'] = el2 => { db.settings.name = el2.value.trim(); save(); toast('Saved'); };
CHG['set-cur']  = el2 => { db.settings.cur = el2.value; save(); renderView(); toast('Currency updated'); };
INP['clear-check'] = el2 => {
  const btn = $('clearBtn');
  if(btn) btn.disabled = el2.value.trim().toUpperCase() !== 'CLEAR';
};
ACT['clear-all'] = () => {
  const v = ($('clearInput')||{}).value || '';
  if(v.trim().toUpperCase() !== 'CLEAR'){ toast('Type CLEAR first'); return; }
  confirmModal('Final confirmation',
    'This is the last step. <b>All user-entered data will be permanently removed</b> from this browser — debts, payments, plans, everything. Settings like your name, currency and mood will be kept.',
    'Yes, delete everything', 'clear-yes');
};
ACT['clear-yes'] = () => {
  const keep = db.settings;
  db = defaultDB();
  db.settings = keep;
  save(); closeModal(); go('dashboard'); toast('All data cleared — a fresh start 🌱');
};
ACT['demo-load'] = () => {
  const hasData = db.debts.length || db.payments.length;
  confirmModal('Load demo data?',
    (hasData ? 'Your <b>current entries will be replaced</b> by the sample dataset. ' : '')
    + 'A realistic set of debts, payments, money plan, funds, scores and wins will be loaded so you can explore every section.',
    'Load demo data', 'demo-load-yes');
};
ACT['demo-load-yes'] = () => {
  db = demoData();
  document.documentElement.dataset.theme = db.settings.mood;
  $$('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.themeSet === db.settings.mood));
  save(); closeModal(); go('dashboard'); toast('Demo data loaded — have a look around 🌅');
};
ACT['export-data'] = () => {
  try{
    const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'debt-payoff-tracker-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
    toast('Backup downloaded — keep it somewhere safe');
  }catch(e){ toast('Export failed — your browser blocked the download'); }
};
CHG['import-data'] = el2 => {
  const file = el2.files && el2.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.debts)) throw new Error('bad file');
      db = normalizeDB(parsed);
      document.documentElement.dataset.theme = db.settings.mood || 'sunrise';
      $$('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.themeSet === (db.settings.mood||'sunrise')));
      save(); go('dashboard'); toast('Data imported — welcome back');
    }catch(e){ toast('That file does not look like a tracker backup'); }
  };
  reader.readAsText(file);
  el2.value = '';
};

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  load();
  document.documentElement.dataset.theme = db.settings.mood || 'sunrise';
  $$('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.themeSet === (db.settings.mood||'sunrise')));
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  $('mastDate').textContent = days[TODAY.getDay()]+' · '+fmtDateY(todayIso());
  save();
  go('dashboard');
})();
</script>
</body>
</html>
